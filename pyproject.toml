[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrademate"
version = "0.1.0"
description = "旧代码升级器 UpgradeMate：规则驱动的跨语言代码升级工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
upm = "main:main"

[tool.setuptools]
py-modules = ["main", "rules", "diff_engine", "executor", "llm_advisor"]
include-package-data = true

[tool.setuptools.package-data]
upgrademate = ["rules/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]