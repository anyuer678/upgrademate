name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short 2>&1 | tee pytest-output.log
      # 防回退：wheel 必须携带规则数据（曾出现 pip 可装但 rules 为空的回归）
      - name: Verify wheel contains rules
        run: |
          pip install build --quiet
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, zipfile
          w = glob.glob('dist/*.whl')[0]
          rules = [n for n in zipfile.ZipFile(w).namelist() if n.endswith('.json') and '/rules/' in n]
          assert len(rules) >= 3, f'wheel 缺少规则数据: {rules}'
          print('wheel rules OK:', rules)
          PY
      - name: Publish test output
        if: failure()
        run: |
          echo "## Test Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 pytest-output.log >> "$GITHUB_STEP_SUMMARY"
